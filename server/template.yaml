AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Job Application API (Express on Lambda)

Parameters:
  MongoDbUri:
    Type: String
    NoEcho: true
    Description: MongoDB Atlas connection string
  JwtSecret:
    Type: String
    NoEcho: true
    Description: JWT signing secret
  ClientOrigin:
    Type: String
    Description: Vercel frontend URL (comma-separated for multiple origins)
    Default: https://your-app.vercel.app

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: nodejs20.x
    Architectures:
      - arm64

Resources:
  JobAppApi:
    Type: AWS::Serverless::HttpApi

  JobAppFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda.handler
      CodeUri: .
      Description: Job Application Express API
      ReservedConcurrentExecutions: 15
      Environment:
        Variables:
          MONGODB_URI: !Ref MongoDbUri
          JWT_SECRET: !Ref JwtSecret
          CLIENT_ORIGIN: !Ref ClientOrigin
          MONGODB_TIMEOUT_MS: '30000'
          MONGODB_MAX_POOL_SIZE: '1'
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref JobAppApi
            Path: /{proxy+}
            Method: ANY
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref JobAppApi
            Path: /
            Method: ANY
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: false
        EntryPoints:
          - lambda.js
        External:
          - '@aws-sdk/*'

  ExportBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldExports
            Status: Enabled
            Prefix: exports/
            ExpirationInDays: 7

  ExportCronFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: cron/exportHandler.handler
      CodeUri: .
      Description: Daily 2 AM export of jobs, customers, items, users, companies, roles
      Timeout: 120
      MemorySize: 1024
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          MONGODB_URI: !Ref MongoDbUri
          EXPORT_BUCKET: !Ref ExportBucket
          EXPORT_CRON_TZ: Asia/Kolkata
          MONGODB_TIMEOUT_MS: '30000'
          MONGODB_MAX_POOL_SIZE: '1'
      Policies:
        - S3WritePolicy:
            BucketName: !Ref ExportBucket
      Events:
        DailyExport:
          Type: Schedule
          Properties:
            Schedule: cron(30 20 * * ? *)
            Description: Daily export at 2:00 AM IST (20:30 UTC)
            Enabled: true
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: false
        EntryPoints:
          - cron/exportHandler.js

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${JobAppApi}.execute-api.${AWS::Region}.amazonaws.com'
  HealthCheck:
    Description: Health check URL
    Value: !Sub 'https://${JobAppApi}.execute-api.${AWS::Region}.amazonaws.com/api/health'
  ExportBucketName:
    Description: S3 bucket for scheduled Excel exports
    Value: !Ref ExportBucket
